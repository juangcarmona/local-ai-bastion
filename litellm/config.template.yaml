# litellm/config.template.yaml

model_list:
  # ===== REAL MODELS =====
  - model_name: ${CHAT_MODEL_NAME}
    litellm_params:
      model: openai/${CHAT_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"

  - model_name: ${CODE_MODEL_NAME}
    litellm_params:
      model: openai/${CODE_MODEL_NAME}
      api_base: http://${HOST}:${CODE_PORT}/v1
      api_key: "noop"

  - model_name: ${EMBED_MODEL_NAME}
    litellm_params:
      model: openai/${EMBED_MODEL_NAME}
      api_base: http://${HOST}:${EMBED_PORT}/v1
      api_key: "noop"

  # ===== CLAUDE CODE ALIASES =====
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/${CHAT_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"
  
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/${CHAT_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/${CODE_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"

  # THIS ONE IS THE MOST IMPORTANT
  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: openai/${CHAT_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"

  - model_name: claude-3-opus
    litellm_params:
      model: openai/${CODE_MODEL_NAME}
      api_base: http://${HOST}:${CODE_PORT}/v1
      api_key: "noop"

  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/${EMBED_MODEL_NAME}
      api_base: http://${HOST}:${EMBED_PORT}/v1
      api_key: "noop"

general_settings:
  request_timeout: 300
  max_parallel_requests: 32

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
