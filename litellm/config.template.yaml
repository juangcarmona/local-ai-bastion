# Generated into litellm/config.yaml via envsubst (run/router.sh).
# One OpenAI-compatible endpoint; routes by model name.

model_list:
  - model_name: ${CHAT_MODEL_NAME}
    litellm_params:
      model: openai/${CHAT_MODEL_NAME}
      api_base: http://${HOST}:${CHAT_PORT}/v1
      api_key: "noop"

  - model_name: ${CODE_MODEL_NAME}
    litellm_params:
      model: openai/${CODE_MODEL_NAME}
      api_base: http://${HOST}:${CODE_PORT}/v1
      api_key: "noop"

  - model_name: ${EMBED_MODEL_NAME}
    litellm_params:
      model: openai/${EMBED_MODEL_NAME}
      api_base: http://${HOST}:${EMBED_PORT}/v1
      api_key: "noop"

general_settings:
  # prevent silent overload cascades
  request_timeout: 300
  max_parallel_requests: 32

router_settings:
  routing_strategy: simple-shuffle
